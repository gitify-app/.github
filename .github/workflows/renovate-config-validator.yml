name: Renovate Config Validation

on:
  # Reusable: consumers call this to validate their own Renovate config.
  workflow_call:
    inputs:
      files:
        description: Space-separated Renovate config/preset files to validate. Empty auto-detects.
        required: false
        type: string
        default: ""
  # Self-triggered: validate the preset files in this repository.
  push:
    branches:
      - main
    paths:
      - "*.json"
      - ".github/workflows/renovate-config-validator.yml"
  # Runs on every pull request so the required status check is always reported.
  # A path-filtered required check would block unrelated PRs (e.g. docs-only).
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate Renovate config
        env:
          INPUT_FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_FILES}" ]; then
            # Explicit list supplied by the caller.
            FILES="${INPUT_FILES}"
          elif compgen -G "renovate.json*" >/dev/null || compgen -G ".renovaterc*" >/dev/null; then
            # A repository's own Renovate config.
            FILES="$(ls renovate.json renovate.json5 renovate.jsonc \
              .renovaterc .renovaterc.json .renovaterc.jsonc .renovaterc.json5 2>/dev/null || true)"
          else
            # Preset repository: every root JSON file is a preset.
            FILES="$(ls ./*.json 2>/dev/null || true)"
          fi
          if [ -z "${FILES}" ]; then
            echo "No Renovate config or preset files found to validate." >&2
            exit 1
          fi
          # Resolve to absolute paths, then validate from an isolated working
          # directory so the repository's own package.json (engines/devEngines)
          # cannot block npm.
          ABS=""
          for f in ${FILES}; do
            ABS="${ABS} $(realpath "$f")"
          done
          echo "Validating:"
          printf '  %s\n' ${ABS}
          cd "$(mktemp -d)"
          # shellcheck disable=SC2086 -- intentional word-splitting of the file list
          npx --yes --ignore-scripts --package renovate -- renovate-config-validator --strict ${ABS}
